name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      # changesets/action only tags and creates GitHub releases when it recognizes the publish
      # output, which @changesets/cli 3 changed, so it's done here. With no changesets pending,
      # the step above published the current version (or found it already published).
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/penciled/package.json').version")
          tag="penciled@$version"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          if ls .changeset/*.md | grep -qv README.md; then exit 0; fi
          awk -v v="## $version" '$0 == v { f = 1; next } /^## / { f = 0 } f' \
            packages/penciled/CHANGELOG.md > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md

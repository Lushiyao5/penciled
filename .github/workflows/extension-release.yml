name: Extension release

# Push a tag like `extension-v0.1.0` to build the Chrome and Edge packages and attach them to a
# GitHub release. Uploading them to the stores is done by hand.
on:
  push:
    tags: ['extension-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the extension's version
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "$GITHUB_REF_NAME" != "extension-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/extension/package.json ($version)"
            exit 1
          fi
      - run: pnpm --filter penciled build
      - run: pnpm --filter extension test
      - run: pnpm --filter extension zip
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#extension-v}
          awk -v v="## $version" '$0 == v { f = 1; next } /^## / { f = 0 } f' \
            apps/extension/CHANGELOG.md > notes.md
          # The library's releases stay "Latest", since that's what most visitors look for.
          gh release create "$GITHUB_REF_NAME" apps/extension/.output/*.zip \
            --title "penciled for the browser $version" --notes-file notes.md --latest=false

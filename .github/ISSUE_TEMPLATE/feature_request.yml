name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: penciled is a text annotation library, not a website review tool. Screenshots, drawing, threaded discussions, user accounts and sync backends are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What the API or behaviour might look like.

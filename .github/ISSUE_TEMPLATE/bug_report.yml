name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction link
      description: A StackBlitz/CodeSandbox link or a minimal repo. Anchoring bugs need the HTML content.
  - type: input
    id: version
    attributes:
      label: penciled version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 18.1, iOS 18
    validations:
      required: true
